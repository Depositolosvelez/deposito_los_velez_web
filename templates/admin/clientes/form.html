{% extends "base.html" %}

{% block contenido %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold mb-0">
                        {% if cliente %}
                            <i class="bi bi-pencil-fill text-warning me-2"></i>Editar cliente
                        {% else %}
                            <i class="bi bi-person-plus-fill text-warning me-2"></i>Nuevo cliente
                        {% endif %}
                    </h2>
                    <a href="{{ url_for('clientes.lista') }}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>Volver
                    </a>
                </div>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endwith %}

                <div class="card shadow border-0">
                    <div class="card-body p-4">
                        <form method="POST">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nombre <span class="text-danger">*</span></label>
                                <input type="text" name="nombre" class="form-control"
                                       value="{{ cliente.nombre if cliente else '' }}" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Teléfono</label>
                                    <input type="text" name="telefono" class="form-control"
                                           value="{{ cliente.telefono if cliente else '' }}"
                                           placeholder="Ej: 3001234567">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Ciudad</label>
                                    <input type="text" name="ciudad" class="form-control"
                                           value="{{ cliente.ciudad if cliente else '' }}"
                                           placeholder="Ej: Montería">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Producto de interés</label>
                                <input type="text" name="producto_interes" class="form-control"
                                       value="{{ cliente.producto_interes if cliente else '' }}"
                                       placeholder="Ej: Cemento, Varillas, Ladrillos...">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Estado</label>
                                <select name="estado" class="form-select">
                                    {% for e in estados %}
                                        <option value="{{ e }}"
                                            {% if cliente and cliente.estado == e %}selected
                                            {% elif not cliente and e == 'Interesado' %}selected{% endif %}>
                                            {{ e }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Notas</label>
                                <textarea name="notas" class="form-control" rows="3"
                                          placeholder="Información adicional del cliente...">{{ cliente.notas if cliente else '' }}</textarea>
                            </div>

                            <button type="submit" class="btn btn-warning fw-bold w-100">
                                {% if cliente %}
                                    <i class="bi bi-save-fill me-1"></i>Guardar cambios
                                {% else %}
                                    <i class="bi bi-person-plus-fill me-1"></i>Agregar cliente
                                {% endif %}
                            </button>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
</section>
<script>
function iniciarDictado() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        document.getElementById('voz-estado').innerHTML =
            '<span class="text-danger">Tu navegador no soporta dictado por voz. Usa Chrome.</span>';
        return;
    }

    const btn    = document.getElementById('btn-voz');
    const estado = document.getElementById('voz-estado');
    const rec    = new SpeechRecognition();

    rec.lang             = 'es-CO';
    rec.continuous       = false;
    rec.interimResults   = false;

    rec.onstart = function () {
        btn.style.backgroundColor = '#dc3545';
        btn.style.color           = '#fff';
        btn.textContent           = '🎙️ Escuchando...';
        estado.innerHTML          = '<span class="text-muted">Habla ahora: "nombre Juan", "celular 300...", "ciudad Montería"...</span>';
    };

    rec.onend = function () {
        btn.style.backgroundColor = '#fdcb17';
        btn.style.color           = '#000';
        btn.textContent           = '🎤 Dictar datos del cliente';
    };

    rec.onerror = function (e) {
        estado.innerHTML = '<span class="text-danger">Error: ' + (e.error === 'no-speech' ? 'No se detectó voz.' : e.error) + '</span>';
    };

    rec.onresult = function (event) {
        const texto = event.results[0][0].transcript.trim();
        const t     = texto.toLowerCase();

        const campo = {
            nombre:           document.querySelector('[name=nombre]'),
            telefono:         document.querySelector('[name=telefono]'),
            ciudad:           document.querySelector('[name=ciudad]'),
            producto_interes: document.querySelector('[name=producto_interes]'),
            notas:            document.querySelector('[name=notas]'),
            estado:           document.querySelector('[name=estado]'),
        };

        let llenado = false;

        if (/^nombre\s+/i.test(t)) {
            campo.nombre.value = texto.replace(/^nombre\s+/i, '');
            llenado = true;
        } else if (/^(celular|teléfono|telefono|cel)\s+/i.test(t)) {
            campo.telefono.value = texto.replace(/^(celular|teléfono|telefono|cel)\s+/i, '').replace(/\s/g, '');
            llenado = true;
        } else if (/^ciudad\s+/i.test(t)) {
            campo.ciudad.value = texto.replace(/^ciudad\s+/i, '');
            llenado = true;
        } else if (/^(busca|buscan|producto|interés|interes)\s+/i.test(t)) {
            campo.producto_interes.value = texto.replace(/^(busca|buscan|producto|interés|interes)\s+/i, '');
            llenado = true;
        } else if (/^notas?\s+/i.test(t)) {
            campo.notas.value = texto.replace(/^notas?\s+/i, '');
            llenado = true;
        } else if (/^estado\s+/i.test(t)) {
            const val = texto.replace(/^estado\s+/i, '').trim().toLowerCase();
            for (let opt of campo.estado.options) {
                if (opt.value.toLowerCase() === val) {
                    campo.estado.value = opt.value;
                    llenado = true;
                    break;
                }
            }
        }

        if (llenado) {
            estado.innerHTML = '<span class="text-success">✔ Reconocido: "' + texto + '"</span>';
        } else {
            estado.innerHTML = '<span class="text-warning">No reconocí el campo. Intenta: "nombre Juan", "celular 300...", "ciudad Montería", "busca cemento", "nota ...", "estado Compró".</span>';
        }
    };

    rec.start();
}
</script>

{% endblock contenido %}
