{% extends "base.html" %}

{% block contenido %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold mb-0">
                        {% if cliente %}
                            <i class="bi bi-pencil-fill text-warning me-2"></i>Editar cliente
                        {% else %}
                            <i class="bi bi-person-plus-fill text-warning me-2"></i>Nuevo cliente
                        {% endif %}
                    </h2>
                    <a href="{{ url_for('clientes.lista') }}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>Volver
                    </a>
                </div>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endwith %}

                <div class="card shadow border-0">
                    <div class="card-body p-4">
                        <form method="POST">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nombre <span class="text-danger">*</span></label>
                                <input type="text" name="nombre" class="form-control"
                                       value="{{ cliente.nombre if cliente else '' }}" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Teléfono</label>
                                    <input type="text" name="telefono" class="form-control"
                                           value="{{ cliente.telefono if cliente else '' }}"
                                           placeholder="Ej: 3001234567">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Ciudad</label>
                                    <input type="text" name="ciudad" class="form-control"
                                           value="{{ cliente.ciudad if cliente else '' }}"
                                           placeholder="Ej: Montería">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Producto de interés</label>
                                <input type="text" name="producto_interes" class="form-control"
                                       value="{{ cliente.producto_interes if cliente else '' }}"
                                       placeholder="Ej: Cemento, Varillas, Ladrillos...">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Estado</label>
                                <select name="estado" class="form-select">
                                    {% for e in estados %}
                                        <option value="{{ e }}"
                                            {% if cliente and cliente.estado == e %}selected
                                            {% elif not cliente and e == 'Interesado' %}selected{% endif %}>
                                            {{ e }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">¿Cómo nos conoció?</label>
                                <select name="fuente" class="form-select">
                                    {% for f in fuentes %}
                                        <option value="{{ f }}"
                                            {% if cliente and cliente.fuente == f %}selected
                                            {% elif not cliente and f == 'Walk-in' %}selected{% endif %}>
                                            {{ f }}{% if f == 'Walk-in' %} (vino al local){% endif %}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Notas</label>
                                <textarea name="notas" class="form-control" rows="3"
                                          placeholder="Información adicional del cliente...">{{ cliente.notas if cliente else '' }}</textarea>
                            </div>

                            <button type="submit" class="btn btn-warning fw-bold w-100">
                                {% if cliente %}
                                    <i class="bi bi-save-fill me-1"></i>Guardar cambios
                                {% else %}
                                    <i class="bi bi-person-plus-fill me-1"></i>Agregar cliente
                                {% endif %}
                            </button>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
</section>

{% endblock contenido %}
